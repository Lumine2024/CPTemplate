name: ci

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            kind: gcc
          - os: ubuntu-latest
            kind: clang
          - os: windows-latest
            kind: msvc
          - os: windows-latest
            kind: clang
          - os: windows-latest
            kind: gcc
          - os: windows-latest
            kind: clang-cl
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup MSVC Developer Command Prompt
        if: matrix.kind == 'msvc'
        uses: ilammy/msvc-dev-cmd@v1
      - name: Run CI Script
        shell: pwsh
        run: ./tests/ci.ps1 -Compiler '${{ matrix.kind }}'